<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うたかた テロップ自動配置ツール</title>
<style>
  /* 日本語装飾フォント */
  @font-face {
    font-family: 'MPlusRounded';
    src: url('/fonts/MPlusRounded1c-Bold.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'HachiMaruPop';
    src: url('/fonts/HachiMaruPop-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'KleeOne';
    src: url('/fonts/KleeOne-SemiBold.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'ZenMaruGothic';
    src: url('/fonts/ZenMaruGothic-Bold.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'ShipporiMincho';
    src: url('/fonts/ShipporiMinchoB1-Bold.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'HinaMincho';
    src: url('/fonts/HinaMincho-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'DelaGothic';
    src: url('/fonts/DelaGothicOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'RampartOne';
    src: url('/fonts/RampartOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'DotGothic16';
    src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'YuseiMagic';
    src: url('/fonts/YuseiMagic-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'YujiBoku';
    src: url('/fonts/YujiBoku-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'ZenOldMincho';
    src: url('/fonts/ZenOldMincho-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'KaiseiDecol';
    src: url('/fonts/KaiseiDecol-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'ReggaeOne';
    src: url('/fonts/ReggaeOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'CherryBomb';
    src: url('/fonts/CherryBombOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'NewTegomin';
    src: url('/fonts/NewTegomin-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'MochiyPop';
    src: url('/fonts/MochiyPopOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Slackside';
    src: url('/fonts/SlacksideOne-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'KaiseiHarunoUmi';
    src: url('/fonts/KaiseiHarunoUmi-Bold.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'KosugiMaru';
    src: url('/fonts/KosugiMaru-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'ZenAntiqueSoft';
    src: url('/fonts/ZenAntiqueSoft-Regular.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Stick';
    src: url('/fonts/Stick-Regular.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --c-primary: #5d7b7c;
    --c-primary-dark: #45615f;
    --c-accent: #b89178;
    --c-bg: #faf7f2;
    --c-card: #ffffff;
    --c-text: #2c2c2c;
    --c-muted: #7a7a7a;
    --c-line: #e8e2d8;
    --c-soft: #f5f1ea;
    --c-danger: #b56565;
    --c-ok: #6b8b6e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--c-bg); color: var(--c-text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.6; font-size: 14px;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

  header {
    text-align: center; padding: 24px 16px 20px;
    border-bottom: 1px solid var(--c-line);
    margin-bottom: 24px;
  }
  header .brand {
    font-size: 11px; color: var(--c-muted); letter-spacing: 0.25em;
    margin-bottom: 8px;
  }
  header h1 {
    margin: 0 0 6px; font-size: 22px; font-weight: 500;
    color: var(--c-primary-dark); letter-spacing: 0.05em;
    font-family: "Hiragino Mincho ProN", serif;
  }
  header p {
    margin: 0; font-size: 12px; color: var(--c-muted);
  }
  .phase-tag {
    display: inline-block; margin-left: 8px;
    background: var(--c-accent); color: white;
    padding: 1px 6px; border-radius: 2px;
    font-size: 9px; letter-spacing: 0.1em; vertical-align: middle;
  }

  .step {
    background: var(--c-card); border: 1px solid var(--c-line);
    border-radius: 8px; padding: 18px 22px; margin-bottom: 14px;
  }
  .step-label {
    font-size: 10px; color: var(--c-accent);
    letter-spacing: 0.2em; font-weight: 700; margin-bottom: 8px;
  }
  .step h3 {
    margin: 0 0 10px; font-size: 15px; font-weight: 600;
    color: var(--c-primary-dark);
  }
  .hint {
    font-size: 11px; color: var(--c-muted); margin-top: 6px;
    line-height: 1.5;
  }

  /* アップロード */
  .upload-area {
    border: 2px dashed var(--c-line); border-radius: 8px;
    padding: 28px 16px; text-align: center; cursor: pointer;
    transition: all 0.15s; background: var(--c-soft);
  }
  .upload-area:hover { border-color: var(--c-primary); background: var(--c-bg); }
  .upload-area input { display: none; }
  .upload-icon {
    font-size: 24px; margin-bottom: 6px; color: var(--c-primary);
  }
  .upload-text { font-size: 13px; color: var(--c-muted); }
  .file-info {
    font-size: 12px; color: var(--c-text);
    margin-top: 10px; padding: 8px 12px;
    background: var(--c-soft); border-radius: 4px;
  }
  /* 固定された動画＋時間バー（常に画面上部に表示） */
  .sticky-control {
    position: sticky; top: 0; z-index: 100;
    background: var(--c-bg);
    margin: 0 -16px 14px; padding: 8px 16px 0;
    border-bottom: 1px solid var(--c-line);
  }
  .preview-video {
    width: 100%; max-height: 40vh; border-radius: 6px;
    background: black; display: block;
  }
  .time-bar {
    background: var(--c-primary); color: white;
    padding: 10px 14px; border-radius: 0 0 6px 6px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px;
  }
  .time-bar .current-time {
    font-family: "SF Mono", Monaco, monospace; font-size: 18px;
    font-weight: 600; letter-spacing: 0.05em;
  }
  .time-bar .add-here {
    background: white; color: var(--c-primary-dark);
    border: none; padding: 8px 14px; border-radius: 4px;
    font-size: 13px; cursor: pointer; font-family: inherit;
    font-weight: 700;
  }
  .time-bar .add-here:hover { opacity: 0.92; }

  /* インライン時間取得ボタン（テロップ行内） */
  .time-controls {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 8px;
  }
  .time-btn {
    background: var(--c-accent); color: white;
    border: none; padding: 10px 8px; border-radius: 4px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    text-align: center;
  }
  .time-btn:hover { opacity: 0.88; }
  .time-btn .label {
    font-size: 9px; opacity: 0.85; letter-spacing: 0.1em;
    display: block; margin-bottom: 2px;
  }
  .time-btn .val {
    font-family: "SF Mono", monospace; font-size: 13px;
    font-weight: 700;
  }
  .telop-actions {
    display: flex; justify-content: space-between;
    margin-top: 10px; gap: 8px;
  }
  .seek-btn {
    background: var(--c-soft); color: var(--c-primary-dark);
    border: 1px solid var(--c-line); padding: 6px 12px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
    font-family: inherit;
  }
  .seek-btn:hover { background: var(--c-line); }

  /* ボタン */
  .btn {
    border: none; border-radius: 6px; padding: 10px 18px;
    font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--c-primary); color: white; width: 100%;
    padding: 12px 18px; font-weight: 600; letter-spacing: 0.05em;
  }
  .btn-primary:hover:not(:disabled) { background: var(--c-primary-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-icon {
    background: transparent; color: var(--c-muted);
    padding: 4px 8px; font-size: 12px;
  }
  .btn-icon:hover { color: var(--c-danger); }

  /* AI機能トグル */
  .ai-toggle {
    background: var(--c-soft); border-radius: 6px;
    padding: 10px 14px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .ai-toggle:hover { background: #eee5d6; }
  .ai-toggle input[type="checkbox"] {
    accent-color: var(--c-primary);
    width: 16px; height: 16px;
  }
  .ai-toggle-text { flex: 1; }
  .ai-toggle-title {
    font-weight: 600; font-size: 13px; color: var(--c-primary-dark);
  }
  .ai-toggle-desc {
    font-size: 11px; color: var(--c-muted); margin-top: 2px;
  }

  /* テロップ入力 */
  .telop-row {
    background: var(--c-soft); border-radius: 6px;
    padding: 12px 14px; margin-bottom: 8px;
    position: relative;
  }
  .telop-row .telop-num {
    position: absolute; top: 8px; right: 12px;
    font-size: 10px; color: var(--c-muted);
    font-family: "SF Mono", monospace;
  }
  .telop-row textarea {
    width: 100%; border: 1px solid var(--c-line); background: white;
    border-radius: 4px; padding: 8px 10px; font-family: inherit;
    font-size: 14px; resize: vertical; min-height: 40px;
  }
  .telop-row textarea:focus { outline: none; border-color: var(--c-primary); }
  .telop-meta {
    display: grid; grid-template-columns: 1fr 1fr 1fr auto;
    gap: 8px; margin-top: 8px; align-items: end;
  }
  .telop-meta label {
    font-size: 10px; color: var(--c-muted); display: block;
    margin-bottom: 3px; letter-spacing: 0.05em; font-weight: 600;
  }
  .telop-meta input, .telop-meta select {
    width: 100%; padding: 6px 8px; font-size: 12px;
    border: 1px solid var(--c-line); border-radius: 4px;
    background: white; font-family: inherit;
  }
  .telop-meta input:focus, .telop-meta select:focus {
    outline: none; border-color: var(--c-primary);
  }

  /* スタイルプレビュー */
  .style-preview-wrap {
    margin-top: 8px;
  }
  .style-preview {
    background: linear-gradient(90deg, #3a4040 0%, #3a4040 50%, #d8d2c8 50%, #e8e2d8 100%);
    min-height: 60px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .style-preview::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 8px,
      rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 16px);
  }
  .style-preview-text {
    padding: 6px 14px; text-align: center; max-width: 100%;
    word-break: break-all; position: relative; z-index: 1;
  }
  .color-picker-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px;
  }
  .color-picker-wrap input[type="color"] {
    width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--c-line); border-radius: 4px;
    cursor: pointer; background: white;
  }
  .color-picker-wrap label {
    font-size: 11px; color: var(--c-muted);
    letter-spacing: 0.05em;
  }
  .color-picker-wrap .reset-color {
    background: var(--c-soft); color: var(--c-muted);
    border: 1px solid var(--c-line);
    padding: 6px 10px; border-radius: 4px;
    font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .color-swatches {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    margin-top: 6px;
  }
  .color-swatches .swatch {
    aspect-ratio: 1; border: 1px solid var(--c-line);
    border-radius: 4px; cursor: pointer;
    padding: 0; transition: transform 0.1s;
  }
  .color-swatches .swatch:hover { transform: scale(1.1); }
  .color-swatches .swatch.active {
    border: 2px solid var(--c-primary);
    transform: scale(1.05);
  }

  /* サイズスライダー */
  .size-row {
    margin-top: 8px;
    background: var(--c-soft); padding: 8px 12px; border-radius: 4px;
  }
  .size-row .size-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--c-muted);
    letter-spacing: 0.05em; font-weight: 600; margin-bottom: 4px;
  }
  .size-row .size-label strong { color: var(--c-primary-dark); }
  .size-row input[type="range"] {
    width: 100%; accent-color: var(--c-primary);
  }
  .size-row .reset-size {
    background: white; color: var(--c-muted);
    border: 1px solid var(--c-line);
    padding: 2px 8px; border-radius: 3px;
    font-size: 10px; cursor: pointer; font-family: inherit;
    margin-left: 6px;
  }

  /* カスタムスタイルドロップダウン（実際のフォントでオプション表示） */
  .style-dd {
    position: relative;
    margin-top: 3px;
  }
  .style-dd-trigger {
    width: 100%; padding: 8px 10px;
    background: white; border: 1px solid var(--c-line);
    border-radius: 4px; font-family: inherit; font-size: 12px;
    cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px;
  }
  .style-dd-trigger:hover { border-color: var(--c-primary); }
  .style-dd-trigger .trig-name {
    flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--c-text);
  }
  .style-dd-trigger .caret {
    color: var(--c-muted); font-size: 9px;
  }
  .style-dd-panel {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: white; border: 1px solid var(--c-line);
    border-radius: 4px; max-height: 360px; overflow-y: auto;
    z-index: 50; margin-top: 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }
  .style-dd.open .style-dd-panel { display: block; }
  .style-dd-option {
    padding: 8px 10px; cursor: pointer;
    border-bottom: 1px solid var(--c-line);
  }
  .style-dd-option:last-child { border-bottom: none; }
  .style-dd-option:hover { background: var(--c-soft); }
  .style-dd-option.selected { background: #e6efef; }
  .style-dd-option .opt-sample {
    display: grid; grid-template-columns: 1fr 1fr;
    border-radius: 3px; overflow: hidden;
    min-height: 48px;
  }
  .style-dd-option .opt-sample-half {
    padding: 8px; display: flex; align-items: center;
    justify-content: center; min-height: 48px;
  }
  .style-dd-option .opt-sample-half.dark {
    background: #3a4040;
  }
  .style-dd-option .opt-sample-half.light {
    background: #ebe5d8;
  }
  .style-dd-option .opt-name {
    font-size: 10px; color: var(--c-muted);
    margin-top: 5px; letter-spacing: 0.03em;
  }
  .style-dd-option.selected .opt-name { color: var(--c-primary); font-weight: 700; }

  /* フォントカタログモーダル */
  .catalog-btn {
    background: var(--c-soft); color: var(--c-primary-dark);
    border: 1px solid var(--c-line); padding: 8px 14px;
    border-radius: 4px; font-size: 12px; cursor: pointer;
    font-family: inherit; margin-bottom: 10px; width: 100%;
    font-weight: 600;
  }
  .catalog-btn:hover { background: var(--c-line); }
  .catalog-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 1000; display: none;
    align-items: flex-start; justify-content: center;
    padding: 20px 16px; overflow-y: auto;
  }
  .catalog-modal.open { display: flex; }
  .catalog-content {
    background: var(--c-bg); border-radius: 8px;
    padding: 20px; max-width: 540px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .catalog-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--c-line);
  }
  .catalog-header h3 {
    margin: 0; font-size: 16px; color: var(--c-primary-dark);
  }
  .catalog-close {
    background: var(--c-soft); border: 1px solid var(--c-line);
    padding: 6px 12px; border-radius: 4px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .catalog-grid {
    display: grid; gap: 10px;
  }
  .catalog-card {
    border: 1px solid var(--c-line); border-radius: 4px;
    background: var(--c-card); overflow: hidden;
  }
  .catalog-card .label {
    padding: 8px 12px; background: var(--c-soft);
    font-size: 11px; color: var(--c-primary-dark); font-weight: 600;
    border-bottom: 1px solid var(--c-line);
  }
  .catalog-card .sample {
    background: linear-gradient(90deg, #3a4040 50%, #e8e2d8 50%);
    min-height: 60px; padding: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  /* スタイル定義（CSSプレビュー用） */
  .style-utakata-mincho {
    background: rgba(250, 247, 242, 0.92);
    color: #2c2c2c;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.06em;
    border-left: 2px solid #b89178;
  }
  .style-utakata-sub {
    background: rgba(45, 56, 56, 0.75);
    color: #faf7f2;
    font-family: -apple-system, sans-serif;
    font-size: 13px; font-weight: 400;
    letter-spacing: 0.08em;
  }
  .style-utakata-cta {
    background: rgba(184, 145, 120, 0.92);
    color: #faf7f2;
    font-family: -apple-system, sans-serif;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.15em;
    border-radius: 2px;
  }
  .style-yawaraka {
    background: rgba(252, 240, 235, 0.92);
    color: #5a4040;
    font-family: -apple-system, sans-serif;
    font-size: 14px; font-weight: 600;
    border-radius: 18px;
    padding: 6px 18px;
  }
  .style-shikku {
    background: rgba(20, 20, 20, 0.85);
    color: #f0ead8;
    font-family: -apple-system, sans-serif;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.15em;
  }
  /* 新フォント使用スタイル */
  .style-rounded-soft {
    background: rgba(252, 240, 235, 0.92);
    color: #4a4040;
    font-family: 'MPlusRounded', sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.04em;
    border-radius: 16px;
    padding: 6px 18px;
  }
  .style-pop-cute {
    background: rgba(255, 245, 248, 0.95);
    color: #c47b8a;
    font-family: 'HachiMaruPop', sans-serif;
    font-size: 16px; font-weight: 400;
    letter-spacing: 0.02em;
    border-radius: 20px;
    padding: 6px 18px;
    border: 2px solid #f5c0d0;
  }
  .style-handwritten {
    background: rgba(248, 240, 220, 0.92);
    color: #5a4838;
    font-family: 'KleeOne', serif;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 18px;
  }
  .style-zen-rounded {
    background: rgba(240, 245, 240, 0.92);
    color: #3a4a4a;
    font-family: 'ZenMaruGothic', sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.03em;
    border-radius: 12px;
    padding: 6px 18px;
  }
  /* === ボックスなし系：個性的なタイポグラフィ === */
  .style-mincho-elegant {
    background: transparent;
    color: #faf7f2;
    font-family: 'ShipporiMincho', serif;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.1em;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
  }
  .style-mincho-hina {
    background: transparent;
    color: #f0ead8;
    font-family: 'HinaMincho', serif;
    font-size: 18px; font-weight: 500;
    letter-spacing: 0.15em;
    -webkit-text-stroke: 0.5px rgba(0,0,0,0.3);
    text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
  }
  .style-dela-impact {
    background: transparent;
    color: white;
    font-family: 'DelaGothic', sans-serif;

<body>

<header>
  <div class="brand">UTAKATA</div>
  <h1>テロップ自動配置ツール<span class="phase-tag">Phase 2</span></h1>
  <p>顔検出 + 多彩なフォントで、うたかたスタイルに自動で仕上げる</p>
</header>

<main>

  <div class="step" id="stepUpload">
    <div class="step-label">STEP 1</div>
    <h3>動画を選ぶ</h3>
    <label class="upload-area" for="videoInput" id="uploadLabel">
      <div class="upload-icon">＋</div>
      <div class="upload-text">タップして動画を選択<br>（縦動画 9:16 推奨 / 90秒以内）</div>
      <input type="file" id="videoInput" accept="video/*">
    </label>
    <div class="file-info" id="fileInfo" style="display:none;"></div>
  </div>

  <!-- 動画＋時間バー（画面上部に固定） -->
  <div class="sticky-control" id="stickyControl" style="display:none;">
    <video id="previewVideo" class="preview-video" controls playsinline></video>
    <div class="time-bar">
      <div>
        <div style="font-size:9px;opacity:0.85;letter-spacing:0.15em;">CURRENT TIME</div>
        <div class="current-time" id="currentTimeDisplay">0:00</div>
      </div>
      <button class="add-here" onclick="addTelopAtCurrentTime()">
        📍 ここにテロップ追加
      </button>
    </div>
  </div>

  <div class="step" id="step2" style="display:none;">
    <div class="step-label">STEP 2</div>
    <h3>テロップ</h3>

    <label class="ai-toggle">
      <input type="checkbox" id="faceDetectEnabled" checked>
      <div class="ai-toggle-text">
        <div class="ai-toggle-title">🤖 顔検出で自動配置</div>
        <div class="ai-toggle-desc">位置「自動」で顔のない方向にAIがテロップを配置</div>
      </div>
    </label>

    <div class="hint">動画を再生・停止して、テロップを入れたい瞬間で「ここにテロップ追加」を押す → 文字を打つ → 終了タイミングまで進めて「終了をここに」を押す。長文は自動で改行されます。</div>

    <div id="telopList" style="margin-top:12px;"></div>
  </div>

  <div class="step" id="step3" style="display:none;">
    <div class="step-label">STEP 3</div>
    <h3>テロップを焼き込む</h3>
    <button class="btn btn-primary" id="processBtn" onclick="processVideo()">テロップ入り動画を作る</button>
    <div class="hint">顔検出ON時は数十秒〜数分かかります。タブを閉じないでください。</div>
    <div class="progress" id="progress" style="display:none;"></div>
    <div class="error-box" id="errorBox" style="display:none;"></div>
  </div>

  <div class="step" id="step4" style="display:none;">
    <div class="step-label">STEP 4</div>
    <h3>完成</h3>
    <video id="resultVideo" controls playsinline></video>
    <button class="btn btn-primary" id="downloadBtn" style="margin-top:10px;">動画をダウンロード</button>
  </div>

</main>

<!-- 顔検出に使う非表示の動画要素 -->
<video id="hiddenVideo" style="display:none;" muted playsinline></video>

  'bottom-right': { name: '下端 右寄せ', y: 'h*0.85', x: 'w-text_w-w*0.06' }
};

// face-api.js 動的ロード
async function loadFaceAPI() {
  if (state.faceapiLoaded) return;
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('face-api.js のロードに失敗しました'));
    document.head.appendChild(script);
  });
  await faceapi.nets.tinyFaceDetector.loadFromUri(
    'https://cdn.jsdelivr.net/gh/vladmandic/face-api/model/'
  );
  state.faceapiLoaded = true;
}

// 動画の指定時間のフレームを取得して顔検出
async function detectFacesAtTime(videoEl, timeSec) {
  videoEl.currentTime = Math.max(0, Math.min(videoEl.duration - 0.1, timeSec));
  await new Promise(resolve => {
    const onSeeked = () => { videoEl.removeEventListener('seeked', onSeeked); resolve(); };
    videoEl.addEventListener('seeked', onSeeked);
  });
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth;
  canvas.height = videoEl.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  const detections = await faceapi.detectAllFaces(
    canvas,
    new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 })
  );
  return detections.map(d => ({
    x: d.box.x, y: d.box.y, width: d.box.width, height: d.box.height
  }));
}

// 複数フレームで顔の最上端と最下端を集計し、空いている側を選ぶ
function chooseTopOrBottom(allFaceBoxes, videoHeight) {
  if (allFaceBoxes.length === 0) return 'top';
  // 顔の最上端（最も高い位置）と最下端（最も低い位置）
  const faceTopMin = Math.min(...allFaceBoxes.map(b => b.y));
  const faceBottomMax = Math.max(...allFaceBoxes.map(b => b.y + b.height));
  // テロップが必要とする高さの目安（フォントサイズ42 + ボックスパディング18 ≒ 80px相当の比率）
  // 動画高さに対して約8〜12%とみて、マージン込みで15%確保
  const telopHeightRatio = 0.15;
  const safeTopArea = faceTopMin / videoHeight; // 顔の上の空き
  const safeBottomArea = 1 - (faceBottomMax / videoHeight); // 顔の下の空き
  // 必要な高さが確保できる側のうち、空きが広い方を選ぶ
  const topFits = safeTopArea >= telopHeightRatio;
  const bottomFits = safeBottomArea >= telopHeightRatio;
  if (topFits && !bottomFits) return 'top';
  if (bottomFits && !topFits) return 'bottom';
  return safeTopArea >= safeBottomArea ? 'top' : 'bottom';
}

// 複数時刻でサンプリングして顔ボックスを集める
async function sampleFacesDuringTelop(videoEl, startSec, durationSec) {
  const samples = [];
  // 開始・中間・終了の3点（長尺なら追加）
  const points = durationSec >= 4
    ? [startSec, startSec + durationSec / 3, startSec + 2 * durationSec / 3, startSec + durationSec - 0.1]
    : [startSec, startSec + durationSec / 2, startSec + durationSec - 0.1];
  for (const t of points) {
    try {
      const faces = await detectFacesAtTime(videoEl, t);
      samples.push(...faces);
    } catch (e) { console.warn('顔検出スキップ', t, e); }
  }
  return samples;
}

// 時間フォーマット (秒 → "m:ss.s")
function fmtTime(sec) {
  if (typeof sec !== 'number' || isNaN(sec)) sec = 0;
  const m = Math.floor(sec / 60);
  const s = (sec - m * 60).toFixed(1);
  return `${m}:${s.padStart(4, '0')}`;
}

window.updateTelop = function(id, field, value) {
  const t = state.telops.find(t => t.id === id);
  if (!t) return;
  if (field === 'start' || field === 'duration' || field === 'fontSize') {
    t[field] = value === null ? null : parseFloat(value) || (value === null ? null : 0);
  } else {
    t[field] = value;
  }
  // 文字入力やスタイル変更ではDOM全体を再構築せず、プレビューだけ更新する
  // （全体再構築するとtextareaのカーソル位置が失われる）
  if (field === 'text' || field === 'style') updatePreview(id);
  // 再描画が必要なケース
  if (field === 'start' || field === 'colorOverride' || field === 'fontSize' || field === 'animationIn' || field === 'animationOut') renderTelops();
};

// 終了秒の入力 → 表示時間に変換

  const t = state.telops.find(x => x.id === id);
  if (!t) return;
  const endSec = parseFloat(value) || 0;

};

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeFFText(text) {
  return text
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\\\'")
    .replace(/:/g, '\\:')
    .replace(/%/g, '\\%')
    .replace(/,/g, '\\,');
}

// 長い日本語テキストを自動で改行する
function wrapJapanese(text, maxChars) {
  if (!text || maxChars <= 0) return text;
  const userLines = text.split('\n');
  const result = [];
  for (const line of userLines) {
    if (line.length <= maxChars) {
      result.push(line);
    } else {
      for (let i = 0; i < line.length; i += maxChars) {
        result.push(line.substring(i, i + maxChars));
      }
    }
  }
  return result.join('\n');
}

// HTMLのカラー (#RRGGBB) → ffmpeg形式 (0xRRGGBB)
function ffColorFromHex(hex) {
  if (!hex) return null;
  const cleaned = hex.replace('#', '').toUpperCase();
  return '0x' + cleaned;
}
// ffmpeg形式 (0xRRGGBB or 0xRRGGBB@0.x) → HTML色 (#RRGGBB)
function hexFromFFColor(ff) {
  if (!ff) return '#ffffff';
  const m = ff.match(/0x([0-9A-Fa-f]{6})/);
  return m ? ('#' + m[1].toLowerCase()) : '#ffffff';
}

async function loadFfmpeg() {
  if (state.ffmpegLoaded) return state.ffmpeg;
  const ffmpeg = new FFmpeg();
  ffmpeg.on('log', ({ message }) => console.log('[ffmpeg]', message));
  ffmpeg.on('progress', ({ progress }) => updateProgressBar(progress));
  const base = location.origin;
  await ffmpeg.load({
    coreURL: `${base}/ffmpeg/ffmpeg-core.js`,
    wasmURL: `${base}/ffmpeg/ffmpeg-core.wasm`
  });
  state.ffmpeg = ffmpeg;
  state.ffmpegLoaded = true;
  return ffmpeg;
}

let progressSteps = [];
function setProgress(steps) {
  progressSteps = steps;
  const el = document.getElementById('progress');
  el.style.display = 'block';
  el.innerHTML = steps.map(s =>
    `<div class="progress-row"><div class="progress-dot ${s.state}"></div><div>${s.label}</div></div>`
  ).join('');
}
function updateProgressBar(p) {
  const lastActive = progressSteps.findIndex(s => s.state === 'active');
  if (lastActive < 0) return;
  const el = document.querySelectorAll('.progress-row')[lastActive];
  if (!el) return;
  const pct = Math.round(p * 100);
  const labelDiv = el.children[1];
  const baseLabel = progressSteps[lastActive].label.split('（')[0];
  labelDiv.textContent = `${baseLabel}（${pct}%）`;
}
function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.style.display = 'block';
}

window.processVideo = async function() {
  if (!state.videoFile) { showError('動画を選択してください'); return; }
  const validTelops = state.telops.filter(t => t.text.trim());
  if (validTelops.length === 0) { showError('テロップを1つ以上入力してください'); return; }

  document.getElementById('errorBox').style.display = 'none';
  const btn = document.getElementById('processBtn');
  btn.disabled = true;
  btn.textContent = '処理中...';

  const faceEnabled = document.getElementById('faceDetectEnabled').checked;
  const hasAutoPosition = validTelops.some(t => t.position === 'auto');

  const steps = [];
  if (faceEnabled && hasAutoPosition) {
    steps.push({ label: 'face-api.js 読み込み中', state: 'active' });
    steps.push({ label: '顔検出中', state: '' });
  }
  steps.push({ label: 'ffmpeg.wasm 読み込み中', state: faceEnabled && hasAutoPosition ? '' : 'active' });
  steps.push({ label: 'フォント・動画を準備中', state: '' });
  steps.push({ label: 'テロップを焼き込み中', state: '' });
  setProgress(steps);

  try {
    let stepIdx = 0;

    // 顔検出
    if (faceEnabled && hasAutoPosition) {
      await loadFaceAPI();
      steps[stepIdx].state = 'done'; stepIdx++;
      steps[stepIdx].state = 'active'; setProgress(steps);

      const hiddenVideo = document.getElementById('hiddenVideo');
      for (const t of validTelops) {
        if (t.position !== 'auto') continue;
        const faces = await sampleFacesDuringTelop(hiddenVideo, t.start, t.duration);
        t.detectedPosition = chooseTopOrBottom(faces, hiddenVideo.videoHeight);
      }
      renderTelops();
      steps[stepIdx].state = 'done'; stepIdx++;
    }

    // ffmpeg ロード
    steps[stepIdx].state = 'active'; setProgress(steps);
    const ffmpeg = await loadFfmpeg();
    steps[stepIdx].state = 'done'; stepIdx++;

    // フォント・動画準備
    steps[stepIdx].state = 'active'; setProgress(steps);
    const usedFonts = [...new Set(validTelops.map(t => STYLES[t.style].font))];
    const fallbackFont = 'ffmpeg/font.ttf';
    const loadedFonts = new Set();
    let needFallback = false;
    for (const fontPath of usedFonts) {
      const fontName = fontPath.split('/').pop();
      try {
        const res = await fetch('/' + fontPath);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const buf = new Uint8Array(await res.arrayBuffer());
        await ffmpeg.writeFile(fontName, buf);
        loadedFonts.add(fontPath);
      } catch (e) {
        console.warn(`フォント読み込み失敗 (${fontPath}): ${e.message}. 標準フォントで代替します`);
        needFallback = true;
      }
    }
    // フォールバック用にfont.ttfを必ずロード
    if (needFallback || !loadedFonts.has(fallbackFont)) {
      try {
        const res = await fetch('/' + fallbackFont);
        if (res.ok) {
          const buf = new Uint8Array(await res.arrayBuffer());
          await ffmpeg.writeFile('font.ttf', buf);
          loadedFonts.add(fallbackFont);
        }
      } catch (e) { console.warn('標準フォントも読み込めませんでした', e); }
    }
    const inputExt = state.videoFile.name.match(/\.[^.]+$/)?.[0] || '.mp4';
    const inputName = 'input' + inputExt;
    await ffmpeg.writeFile(inputName, await fetchFile(state.videoFile));
    steps[stepIdx].state = 'done'; stepIdx++;

    // テロップ焼き込み
    steps[stepIdx].state = 'active'; setProgress(steps);

    // 動画幅から自動改行に使う最大文字数を概算（マージン10%）
    const videoW = state.videoWidth || 1080;

    const filterParts = validTelops.map(t => {
      const style = STYLES[t.style];
      const animIn = ANIMATIONS[t.animationIn || 'fade-soft'] || ANIMATIONS['fade-soft'];
      const animOut = ANIMATIONS[t.animationOut || 'fade-soft'] || ANIMATIONS['fade-soft'];
      const requestedFontPath = style.font;
      const fontPath = loadedFonts.has(requestedFontPath) ? requestedFontPath : fallbackFont;
      const fontName = fontPath.split('/').pop();
      let positionKey = t.position;
      if (positionKey === 'auto') {
        positionKey = (t.detectedPosition === 'bottom') ? 'bottom-center' : 'top-center';
      }
      const position = POSITIONS[positionKey] || POSITIONS['top-center'];

      // フォントサイズ（テロップ個別 override > スタイル既定）
      const fontSize = t.fontSize || style.fontsize;
      // 自動改行（長い文章対応）
      const maxCharsPerLine = Math.max(4, Math.floor((videoW * 0.9) / fontSize));
      const wrappedText = wrapJapanese(t.text, maxCharsPerLine);
      const text = escapeFFText(wrappedText);

      // 文字色（テロップ個別 override > スタイル既定）
      const fontcolor = t.colorOverride ? ffColorFromHex(t.colorOverride) : style.fontcolor;

      const startT = t.start;
      const endT = t.start + t.duration;
      const startStr = startT.toFixed(2);
      const endStr = endT.toFixed(2);
      const fadeIn = animIn.fadeIn;
      const fadeOut = animOut.fadeOut;
      const fadeInEndStr = (startT + fadeIn).toFixed(2);
      const fadeOutStartStr = (endT - fadeOut).toFixed(2);

      const params = [
        `fontfile=/${fontName}`,
        `text='${text}'`,
        `fontcolor=${fontcolor}`,
        `fontsize=${fontSize}`
      ];

      // === 位置 + 入退場スライド ===
      // 入場: motionDir の反対側からスタート → base へ移動
      // 退場: base から motionDir 方向へ移動して消える
      let xOffset = '0';
      let yOffset = '0';

      if (animIn.motionAxis && fadeIn > 0) {
        const prog = `max(0\\,min(1\\,(t-${startStr})/${fadeIn.toFixed(2)}))`;
        const off = `(1-${prog})*${animIn.distance}`;
        // 入場時の符号は motionDir の反対（反対側からスタートするため）
        const sign = animIn.motionDir > 0 ? '-' : '+';
        if (animIn.motionAxis === 'y') yOffset = `${yOffset}${sign}(${off})`;
        else xOffset = `${xOffset}${sign}(${off})`;
      }

      if (animOut.motionAxis && fadeOut > 0) {
        const prog = `max(0\\,min(1\\,(t-${fadeOutStartStr})/${fadeOut.toFixed(2)}))`;
        const off = `(${prog})*${animOut.distance}`;
        const sign = animOut.motionDir > 0 ? '+' : '-';
        if (animOut.motionAxis === 'y') yOffset = `${yOffset}${sign}(${off})`;
        else xOffset = `${xOffset}${sign}(${off})`;
      }

      const xExpr = `(${position.x})+(${xOffset})`;
      const yExpr = `(${position.y})+(${yOffset})`;
      params.push(`x='${xExpr}'`);
      params.push(`y='${yExpr}'`);

      // ボックス
      if (style.box) {
        params.push(`box=1`);
        params.push(`boxcolor=${style.boxcolor}`);
        params.push(`boxborderw=${style.boxborderw}`);
      }
      // 縁取り
      if (style.borderw) {
        params.push(`borderw=${style.borderw}`);
        if (style.bordercolor) params.push(`bordercolor=${style.bordercolor}`);
      }
      // シャドウ
      if (style.shadowx !== undefined) {
        params.push(`shadowx=${style.shadowx}`);
        params.push(`shadowy=${style.shadowy}`);
        if (style.shadowcolor) params.push(`shadowcolor=${style.shadowcolor}`);
      }

      // フェード alpha
      if ((fadeIn > 0 || fadeOut > 0) && t.duration > Math.max(0.05, fadeIn + fadeOut)) {
        const alpha = `if(lt(t\\,${fadeInEndStr})\\,(t-${startStr})/${Math.max(0.01, fadeIn).toFixed(2)}\\,if(lt(t\\,${fadeOutStartStr})\\,1\\,(${endStr}-t)/${Math.max(0.01, fadeOut).toFixed(2)}))`;
        params.push(`alpha='${alpha}'`);
      }

      params.push(`enable='between(t,${startStr},${endStr})'`);
      return `drawtext=${params.join(':')}`;
    });
    const vf = filterParts.join(',');
    console.log('Filter:', vf);

    await ffmpeg.exec([
      '-i', inputName,
      '-vf', vf,
      '-c:v', 'libx264',
      '-preset', 'ultrafast',
      '-c:a', 'copy',
      '-y',
      'output.mp4'
    ]);

    const outputBuf = await ffmpeg.readFile('output.mp4');
    state.resultBlob = new Blob([outputBuf.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(state.resultBlob);

    const video = document.getElementById('resultVideo');
    video.src = url;
    document.getElementById('step4').style.display = 'block';

    document.getElementById('downloadBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = url;
      a.download = `utakata_${Date.now()}.mp4`;
      a.click();
    };

    steps[stepIdx].state = 'done'; setProgress(steps);
    document.getElementById('step4').scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    console.error(err);
    showError('処理中にエラーが発生しました: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'テロップ入り動画を作る';
  }
};

</script>

</body>
